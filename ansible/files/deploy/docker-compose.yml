services:
  my_website:
    image: dominikmatic/my_website:latest
    container_name: my_website
    restart: 'unless-stopped'
    networks:
      - internal
    depends_on:
      - heimdallr
  heimdallr:
    image: dominikmatic/heimdallr:latest
    container_name: heimdallr
    restart: 'unless-stopped'
    ports:
      - "9090:9090"
    volumes:
      - type: bind
        source: /opt/my_website/heimdallr/policy.yml
        target: /etc/heimdallr/policy.yml
        read_only: true
    networks:
      - internal
  nginx:
    image: nginx:1.29.0-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: /opt/my_website/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: /etc/letsencrypt
        target: /etc/letsencrypt
        read_only: true
    restart: 'unless-stopped'
    networks:
      - internal

networks:
  internal:
    driver: bridge
